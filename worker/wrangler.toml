name = "x402-trust-check"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Public addresses: api.settlewatch.com (current) and check.benmcalilly.com (kept so earlier links,
# the Bazaar listing and older x402-trust-guard installs keep working). workers.dev stays on as well.
routes = [
  { pattern = "api.settlewatch.com", custom_domain = true },
  { pattern = "check.benmcalilly.com", custom_domain = true },
]
# Keep the old address answering: x402scan, the Bazaar and the first payment all used it.
workers_dev = true
preview_urls = false

[vars]
# The board (GitHub Pages, HTTPS enforced). The old github.io address redirects here.
BOARD_URL = "https://settlewatch.com/"
# Price per check, in USD (paid in USDC on Base). Change it and run `npx wrangler deploy`.
PRICE = "$0.01"

# Set these with `npx wrangler secret put NAME` (never in this file):
#   PAY_TO              your Base address that receives the $0.001 payments
#   CDP_API_KEY_ID      from portal.cdp.coinbase.com > API keys
#   CDP_API_KEY_SECRET
#   ALERTS_TOKEN        a long random string; the same value goes in the board's settings.env

# Holds alert sign-up requests until the board picks them up (created on first deploy).
[[kv_namespaces]]
binding = "SIGNUPS"
